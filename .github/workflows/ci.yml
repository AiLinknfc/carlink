name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff==0.16.6 mypy==2.3.1

      - name: Lint backend
        run: |
          cd backend
          ruff check app/

      - name: Type-check backend
        # No bloqueante: 29 errores de mypy pre-existentes (nunca antes exigidos para
        # mergear, ver docs/PENDIENTES.md) — se listan igual acá para verlos, pero no
        # tumban el job hasta que se paguen deliberadamente. Volver a quitar
        # continue-on-error una vez estén en 0.
        continue-on-error: true
        run: |
          cd backend
          mypy app/ --ignore-missing-imports

      - name: Test backend
        run: |
          cd backend
          pytest tests/ -v

      - name: Install Node deps
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Test frontend
        run: |
          cd frontend
          npx vitest run

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
